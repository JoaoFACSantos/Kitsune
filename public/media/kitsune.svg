  <path d="M272 634C288 630 306 636 306 650C306 662 294 666 278 664C270 656 268 642 272 634Z" fill="#4A1F45"/>
  <path d="M291 640q5 2 5 6M290 651q5 2 5 6" fill="none" stroke="#7A4070" stroke-width="3" stroke-linecap="round"/>

  <!-- cauda, à frente: no tom do corpo, separada por um contorno fino -->
