  <path d="M262 88c34-26 104-30 148 6" fill="none" stroke="#B08276" stroke-width="9" stroke-linecap="round" opacity="0.75"/>

  <!-- pescoço, ombros e top (parados: a cabeça roda por cima do pescoço) -->
  <path d="M306 330v64c-6 22-44 32-66 52-16 14-20 40-20 66v288h232V512c0-26-4-52-20-66-22-20-60-30-66-52v-64Z" fill="#FFD0B8"/>
  <path d="M306 350c14 22 46 22 60 0v18c-14 20-46 20-60 0Z" fill="#F3B79E"/>
  <!-- top com decote em coração; as alças sobem até à linha do ombro (recortadas pelo corpo) -->
  <path d="M336 534q-1 7 0 14" fill="none" stroke="#EAA88F" stroke-width="2.500" stroke-linecap="round"/>
  <path d="M214 592C214 550 240 520 272 518C298 518 322 532 336 548C350 532 374 518 400 518C432 520 458 550 458 592V800H214Z" fill="#34143A"/>
