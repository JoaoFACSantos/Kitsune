    <path d="M210 800C230 700 326 640 424 650C490 656 536 720 532 800Z" fill="#FF9A52"/>
    <path d="M424 650C490 656 536 720 532 800H450L438 770L452 754L430 730L446 714L424 690L440 676Z" fill="#FFF3E4"/>
    <path d="M300 742c30-26 68-40 106-42M268 782c26-20 58-34 92-40" fill="none" stroke="#F08442" stroke-width="3" stroke-linecap="round"/>
    <path d="M210 800C230 700 326 640 424 650C490 656 536 720 532 800" fill="none" stroke="#E27A38" stroke-width="2.500" stroke-linecap="round"/>
  </g>

  <!-- raposa: cabeça encostada, a piscar o olho -->
