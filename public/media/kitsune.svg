<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760">
  <title>Kitsune abraçada a uma raposa</title>
  <style>
    .girl-head { transform-box: view-box; transform-origin: 336px 372px; animation: tilt 7s ease-in-out infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .fox-head { transform-box: view-box; transform-origin: 300px 384px; animation: nuzzle 4.5s ease-in-out infinite; }
    .ear { transform-box: view-box; transform-origin: 356px 172px; animation: twitch 6s ease-in-out infinite; }
    .tail { transform-box: view-box; transform-origin: 260px 780px; animation: wag 2.8s ease-in-out infinite; }
    @keyframes tilt { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.08); } 96% { transform: scaleY(1); } }
    @keyframes nuzzle { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(2deg); } }
    @keyframes twitch { 0%, 84%, 100% { transform: rotate(0); } 88% { transform: rotate(6deg); } 92% { transform: rotate(-3deg); } 96% { transform: rotate(3deg); } }
    @keyframes wag { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
    /* A ver televisão: com o ficheiro aberto como kitsune.svg#watch, as duas viram-se para a direita. */
    .fox-eye-open { display: none; }
    #watch:target .fox-wink { display: none; }
    #watch:target .fox-eye-open { display: inline; }
    #watch:target .girl-head { animation: turn-girl 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.15s both, sway-girl 5s ease-in-out 1.05s infinite; }
    #watch:target .face { animation: look 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.15s both; }
    #watch:target .pupils { animation: glance 0.6s ease-out 0.1s both; }
    #watch:target .fox-head { animation: turn-fox 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.3s both, sway-fox 4s ease-in-out 1.2s infinite; }
    #watch:target .fox-face { animation: look-fox 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.3s both; }
    @keyframes turn-girl { from { transform: rotate(0); } to { transform: rotate(5deg); } }
    @keyframes sway-girl { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(6.5deg); } }
    @keyframes look { to { transform: translate(11px, 1px); } }
    @keyframes glance { to { transform: translate(4px, 0); } }
    @keyframes turn-fox { from { transform: rotate(0); } to { transform: rotate(13deg); } }
    @keyframes sway-fox { 0%, 100% { transform: rotate(13deg); } 50% { transform: rotate(16deg); } }
    @keyframes look-fox { to { transform: translate(14px, 0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="torso">
      <path d="M306 330v64c-6 22-44 32-66 52-16 14-20 40-20 66v288h232V512c0-26-4-52-20-66-22-20-60-30-66-52v-64Z"/>
    </clipPath>
    <clipPath id="foxface">
      <path d="M300 132C366 132 408 176 412 238C428 258 444 282 452 306C436 306 424 312 414 320C424 334 428 348 428 360C410 356 396 360 386 368C366 388 334 398 300 398C266 398 234 388 214 368C204 360 190 356 172 360C172 348 176 334 186 320C176 312 164 306 148 306C156 282 172 258 188 238C192 176 234 132 300 132Z"/>
    </clipPath>
  </defs>

  <g id="watch">

  <!-- cabelo comprido e ondulado, atrás -->
  <path d="M336 40C240 40 172 112 168 214c-2 48-36 72-40 122-4 44 22 68 10 114-12 46-46 72-42 130 4 50 28 76 16 126-6 24-12 54-16 84h472c-6-40 16-74 6-122-10-48-42-68-34-120 8-48 38-78 26-128-10-44-42-64-46-110-4-40-8-60-10-96C506 112 432 40 336 40Z" fill="#6E443C"/>
