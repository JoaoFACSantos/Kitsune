    <ellipse cx="272" cy="296" rx="19" ry="10" fill="#FF8DB8" opacity="0.6"/>
    <ellipse cx="400" cy="296" rx="19" ry="10" fill="#FF8DB8" opacity="0.6"/>
    <path d="M334 280q6 5 0 10" fill="none" stroke="#E79E88" stroke-width="3.500" stroke-linecap="round"/>
    <path d="M310 312c9-6 19-4 26 0 7-4 17-6 26 0-9 18-43 18-52 0Z" fill="#E8517F"/>
    <path d="M310 312c16 5 36 5 52 0" fill="none" stroke="#B8305C" stroke-width="2.500" stroke-linecap="round"/>

    </g>

    <!-- madeixas onduladas a cair pelos lados da cara -->
    <path d="M352 88c-74-6-130 46-136 138-3 50 8 86-8 128-12 34-42 50-46 92-3 30 10 50 4 78-22-30-32-66-22-104 10-36 30-58 34-98 6-58-2-126 32-176 32-46 90-70 142-58Z" fill="#7D5046"/>
    <path d="M350 88c68-2 110 48 112 134 0 48 14 78 28 114 14 36-4 74 10 114 12 36 40 50 36 96-16-26-40-36-52-70-12-36 2-72-14-106-18-40-30-80-30-140 0-60-30-110-90-126Z" fill="#7D5046"/>
    <!-- franja em cortina -->
    <path d="M354 90c-56 6-98 48-112 120 26-34 62-60 110-72Z" fill="#8A5A4F"/>
    <path d="M350 90c52 6 90 46 100 114-22-32-54-54-100-66Z" fill="#8A5A4F"/>
    <path d="M330 104c-30 12-54 34-70 66M372 104c26 10 46 30 60 58M222 240c-6 44 2 80-10 118M456 236c6 40 16 70 30 100" fill="none" stroke="#B08276" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- raposa ao colo: corpo em pera, sombra por baixo da cabeça e peito felpudo -->
  <path d="M104 800C96 716 108 640 138 598C156 574 252 574 270 598C300 640 318 716 322 800Z" fill="#FF9A52"/>
  <path d="M156 592C180 582 228 582 252 592C260 620 252 648 240 664C234 654 226 652 221 662C215 674 209 680 204 692C199 680 193 674 187 662C182 652 174 654 168 664C156 648 148 620 156 592Z" fill="#FFF3E4"/>

