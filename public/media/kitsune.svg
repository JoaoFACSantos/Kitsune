  <path d="M161 701v9M175 701v9" fill="none" stroke="#7A4070" stroke-width="3" stroke-linecap="round"/>

  <!-- braço a abraçar a raposa: sai da linha do ombro, dobra no cotovelo e passa por cima do corpo dela -->
